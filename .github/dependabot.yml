version: 2

# The CDK library and CLI are updated together in one weekly PR: a newer aws-cdk-lib can
# need a newer CLI. The "Infrastructure check" workflow says on the PR whether it can ship
# with a routine deploy or needs an admin deploy first.
multi-ecosystem-groups:
  cdk:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "pip"
    directory: "/infrastructure"
    patterns: ["aws-cdk-lib", "constructs"]
    multi-ecosystem-group: "cdk"

  - package-ecosystem: "npm"
    directory: "/infrastructure"
    patterns: ["aws-cdk"]
    multi-ecosystem-group: "cdk"

  # Lambda and test dependencies: one weekly PR. These only change the function's code,
  # so they ship with a routine deploy.
  - package-ecosystem: "pip"
    directories: ["/lambda", "/tests"]
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
